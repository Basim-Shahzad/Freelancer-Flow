<!doctype html>
<html>
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:Helvetica,Arial,sans-serif;color:#111;">
  <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #ddd;border-radius:6px;">
    <tr><td style="padding:24px;font-size:15px;line-height:1.5;">
      {% block body %}{% endblock %}

    </td></tr>
  </table>

</html>
