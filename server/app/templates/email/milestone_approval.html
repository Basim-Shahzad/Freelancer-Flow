{% extends "email/_layout.html" %}
{% block body %}
<p>Hi {{ client_name }},</p>
<p><b>{{ issuer_name }}</b> submitted the milestone <b>{{ milestone_name }}</b> on <b>{{ project_name }}</b> for your approval.</p>
<p><a href="{{ portal_url }}" style="display:inline-block;padding:10px 18px;background:#111;color:#fff;text-decoration:none;border-radius:4px;">Review and approve</a></p>
<p>If the button does not work, open this link:<br><span style="word-break:break-all;">{{ portal_url }}</span></p>
{% endblock %}
